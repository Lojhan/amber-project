name: amber-procurement

x-workspace-service: &workspace-service
  image: amber-procurement-workspace:local
  working_dir: /workspace

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: procurement
      POSTGRES_USER: procurement
      POSTGRES_PASSWORD: procurement_local_only
    networks: [backend]
    volumes: ['postgres-data:/var/lib/postgresql']
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U procurement -d procurement"]
      interval: 5s
      timeout: 5s
      retries: 10

  db-init:
    <<: *workspace-service
    build:
      context: .
      dockerfile: Dockerfile
    command: sh -c "pnpm db:migrate && pnpm --filter @procurement/persistence seed:catalog"
    environment:
      DATABASE_URL: postgresql://procurement:procurement_local_only@postgres:5432/procurement
    networks: [backend]
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: 'server /data --console-address ":9001"'
    environment:
      MINIO_ROOT_USER: minio_local
      MINIO_ROOT_PASSWORD: minio_local_change_me
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    networks: [backend]
    volumes: ['minio-data:/data']
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio: {condition: service_started}
    entrypoint: /bin/sh
    command: >-
      -c 'set -eu;
      attempt=0;
      until mc alias set local http://minio:9000 minio_local minio_local_change_me >/dev/null 2>&1 && mc ready local >/dev/null 2>&1; do
        attempt=$$((attempt + 1));
        if [ "$$attempt" -ge 60 ]; then echo "MinIO did not become ready" >&2; exit 1; fi;
        sleep 2;
      done;
      mc mb --ignore-existing local/quotation-uploads;
      mc anonymous set none local/quotation-uploads'
    restart: "no"

  api:
    <<: *workspace-service
    command: pnpm --filter @procurement/api dev
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://procurement:procurement_local_only@postgres:5432/procurement
      ACTOR_ID: ${ACTOR_ID:-11111111-1111-4111-8111-111111111111}
      BRAND_ID: ${BRAND_ID:-99999999-0000-4000-8000-000000000001}
      CONFIRMATION_SECRET: ${CONFIRMATION_SECRET:-local-confirmation-secret-change-me-32-characters}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_COPILOT_MODEL: ${OPENAI_COPILOT_MODEL:-gpt-5.6-terra}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://127.0.0.1:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_FORCE_PATH_STYLE: "true"
      S3_BUCKET: ${S3_BUCKET:-quotation-uploads}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minio_local}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minio_local_change_me}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minio_local}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minio_local_change_me}
    ports: ["127.0.0.1:3001:3001"]
    networks: [backend]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/v1/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      postgres: { condition: service_healthy }
      db-init: { condition: service_completed_successfully }
      minio-init: { condition: service_completed_successfully }

  worker:
    <<: *workspace-service
    command: pnpm --filter @procurement/worker dev
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://procurement:procurement_local_only@postgres:5432/procurement
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT: http://minio:9000
      S3_FORCE_PATH_STYLE: "true"
      S3_BUCKET: ${S3_BUCKET:-quotation-uploads}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minio_local}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minio_local_change_me}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minio_local}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minio_local_change_me}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_COPILOT_MODEL: ${OPENAI_COPILOT_MODEL:-gpt-5.6-terra}
    networks: [backend]
    depends_on:
      db-init: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }

  web:
    <<: *workspace-service
    command: pnpm --filter @procurement/web exec vite dev --host 0.0.0.0
    environment:
      VITE_API_PROXY_TARGET: http://api:3001
    ports: ["127.0.0.1:3000:5173"]
    networks: [backend]
    depends_on:
      api: { condition: service_healthy }

volumes:
  postgres-data:
  minio-data:

networks:
  backend:
    driver: bridge
